# Publie une nouvelle version de RetroLib : pousser un tag "v<version>" (identique au
# champ version de package.json) construit l'installeur Windows et le publie, avec
# latest.yml, dans les Releases GitHub. Les RetroLib installées le détectent et se
# mettent à jour (electron-updater, voir src/main/updater.js).
#
#   npm version patch --no-git-tag-version
#   git commit -am "..." && git tag v2.4.1 && git push && git push --tags

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de package.json"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # Construction sans publication par electron-builder : il envoie ses fichiers en
      # parallèle et chaque envoi créait sa propre release pour le même tag (l'une avec
      # l'installeur, l'autre avec le seul .blockmap). GitHub désignait alors comme
      # « latest » une release sans latest.yml, et les mises à jour échouaient.
      - name: Construire l'installeur
        run: npm run build && npx electron-builder --win --publish never

      # Une seule release, créée d'un coup avec les trois fichiers utiles à
      # electron-updater. Une release existante pour ce tag (relance du workflow) est
      # remplacée.
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          files=("dist/retrolib-$version-setup.exe" "dist/retrolib-$version-setup.exe.blockmap" dist/latest.yml)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "RetroLib $version" --generate-notes --latest
